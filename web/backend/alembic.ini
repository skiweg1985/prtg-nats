# Alembic owns the schema in a deployed installation. The first run of a fresh
# checkout still comes up without it - main.py creates the tables - but every
# change after that goes through a revision.

[alembic]
script_location = alembic
prepend_sys_path = .
# The URL comes from app.core.config at runtime; this value is only a
# placeholder so `alembic` runs without an environment.
sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
