[project]
name = "prtg-nats-web"
version = "0.1.0"
description = "Management platform for the PRTG-NATS stack"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "asyncssh>=2.18",
    "httpx>=0.27",
    "argon2-cffi>=23.1",
    "python-ulid>=3.0",
    "cryptography>=43.0",
    "bcrypt>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "A", "C4", "SIM", "RUF"]
ignore = [
    # Assertions are the point in tests, and FastAPI dependencies are calls in
    # argument defaults by design.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# Assertions are the point in tests, a long literal in an assertion reads
# better on one line than wrapped, and the "passwords" are fixture constants.
"tests/*" = ["S101", "S105", "S106", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["asyncssh.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
