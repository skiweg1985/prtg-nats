name: CI

# Every check runs in pull requests and on merges to dev or main. dev is the
# default branch and takes the daily work, main holds the released state; both
# are checked equally strictly.
#
# The end-to-end test against a real prtgmpprobe package takes about a minute,
# pulls the Paessler package over the network and needs privileged containers.
# It runs in pull requests on purpose: noticing a broken rollout before the
# merge is considerably more useful than noticing it afterwards.
on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # whiptail carries the TUI; without the package check-static.sh skips
      # the pass through the dialog layer silently.
      - name: Install tools
        run: |
          apt-get update -qq
          apt-get install -y -qq shellcheck openssl expect whiptail >/dev/null

      - name: Check shell syntax, templates and rendering
        run: ./tests/check-static.sh

      # The frontend check compares the two languages against each other and
      # is satisfied when a key is missing from both. This is the direction
      # that catches that: every job log message the backend can emit, against
      # what the locales carry. It needs neither Node nor the backend
      # dependencies, so it runs here rather than in one of those jobs.
      - name: Check the job log messages against the translations
        run: ./tests/check-job-messages.py

      - name: Check Markdown
        run: |
          if command -v npx >/dev/null 2>&1; then
            npx --yes markdownlint-cli2 "**/*.md"
          else
            echo "npx is not available; Markdown check skipped"
          fi

  iperf-artifacts:
    name: Managed iPerf3 artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install artifact inspection tools
        run: |
          apt-get update -qq
          apt-get install -y -qq binutils shellcheck >/dev/null

      - name: Build and validate every supported probe artifact
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          shellcheck --severity=warning tools/iperf3/*.sh
          artifact_export="$(mktemp -d)"
          docker build \
            --file web/backend/Dockerfile \
            --target iperf-artifacts \
            --output "type=local,dest=${artifact_export}" \
            .
          bash tools/iperf3/check-artifacts.sh \
            "${artifact_export}/tools/iperf3/artifacts"
          # Execute the native artifact as well as inspecting every ELF. This
          # catches a linkable but unusable amd64 build in every change; the
          # helper performs the same version and feature check after activating
          # a selected probe artifact.
          amd64_output="$(
            "${artifact_export}/tools/iperf3/artifacts/linux-amd64-glibc/iperf3" \
              --version 2>&1
          )"
          source tools/iperf3/versions.env
          grep -Fq "iperf ${IPERF_VERSION}" <<<"${amd64_output}"
          grep -Fiq 'authentication' <<<"${amd64_output}"

  compose:
    name: Compose configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Render and validate the Compose configuration
        run: |
          if ! docker compose version >/dev/null 2>&1; then
            echo "Docker Compose is not available on this runner; check skipped."
            exit 0
          fi
          # Site settings no longer have a built-in default; the check sets
          # example values, the way an automated deployment would.
          cp .env.example .env
          cat >> .env <<'ENVEOF'
          NATS_FQDN=nats.example.test
          NATS_HOST_IP=127.0.0.1
          PRTG_CORE_IP=127.0.0.1
          ENVEOF
          sed -i 's/^ *//' .env
          docker compose --project-directory . config --quiet
          echo "The Compose configuration is valid."

          # Who may see which part of the runtime volume. Parsed rather than
          # grepped: a pattern that silently stops matching is a check that
          # passes while checking nothing.
          docker compose --project-directory . config --format json > /tmp/compose.json
          python3 - /tmp/compose.json <<'PY'
          import json, sys

          services = json.load(open(sys.argv[1]))["services"]
          failures = []

          def mounts(name):
              for volume in services.get(name, {}).get("volumes", []):
                  yield (
                      volume.get("source"),
                      (volume.get("volume") or {}).get("subpath"),
                      volume.get("target"),
                      volume.get("type"),
                  )

          # Runtime state belongs in the volume, never on a host path. A bind
          # mount of the checkout is what used to pin an installation to one
          # machine, and it is what the runtime volume replaced.
          for name in services:
              for source, _, target, kind in mounts(name):
                  if kind == "bind" and source and source.rstrip("/").endswith(
                      ("/runtime", "/prtg_nats_gh")
                  ):
                      failures.append(f"{name} bind-mounts runtime state: {source}")

          # NATS reads its configuration and serves its certificates. It has no
          # business seeing the CA key, the credentials, or the private key of
          # the interface certificate - so it gets subpaths, not the volume.
          nats = list(mounts("nats"))
          runtime_subpaths = {sub for src, sub, _, _ in nats if src == "runtime"}
          if runtime_subpaths != {"conf", "certs"}:
              failures.append(
                  f"nats should mount exactly conf/ and certs/, got {runtime_subpaths}"
              )

          # The interface private key goes to the proxy and nowhere else.
          for name in services:
              if name == "web-proxy":
                  continue
              for source, subpath, _, _ in mounts(name):
                  if source == "runtime" and subpath is None and name != "web-api" \
                          and name != "runtime-init":
                      failures.append(f"{name} mounts the whole runtime volume")
                  if subpath == "web-certs":
                      failures.append(f"{name} can read the interface private key")

          if failures:
              print("\n".join(failures))
              sys.exit(1)
          print("Volume exposure is as intended.")
          PY

          # The port from .env has to reach the port binding.
          sed -i 's/^NATS_PORT=.*/NATS_PORT=24999/' .env
          docker compose --project-directory . config |
            grep -q 'published: "24999"' ||
            { echo "NATS_PORT does not reach the port binding"; exit 1; }
          echo "NATS_PORT reaches the port binding."

          # A missing required value has to make Compose itself refuse.
          grep -v '^NATS_HOST_IP' .env > .env.tmp && mv .env.tmp .env
          if docker compose --project-directory . config --quiet 2>/dev/null; then
            echo "A missing NATS_HOST_IP went unnoticed"; exit 1
          fi
          echo "A missing required value is detected."

  backend:
    name: Web backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/backend
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type-check
        run: mypy app

      - name: Test
        run: pytest -q

      # A schema change without a migration is a deployment that fails on the
      # customer's machine rather than here.
      - name: Check that the migrations match the models
        run: |
          export PRTG_NATS_WEB_PROJECT_DIR=/tmp/ci-runtime
          export PRTG_NATS_WEB_DATABASE_URL="sqlite+aiosqlite:////tmp/ci-web.db"
          mkdir -p /tmp/ci-runtime
          alembic upgrade head
          alembic check

  frontend:
    name: Web frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm run test

      # Catches three things that reach a user as an empty label: a key present
      # in one language only, a placeholder that differs between them, and an
      # error code the backend can emit with no message on this side.
      - name: Check the translations
        run: npm run i18n:check

      - name: Build
        run: npx vite build

  e2e:
    name: End-to-end against a real MPP
    runs-on: ubuntu-latest
    # Runs in pull requests, on merges to dev or main, and on demand. The
    # expensive run only pays off once the static checks hold.
    needs:
      - static
    env:
      # The runners can start privileged containers and reach
      # packages.paessler.com; run 146 proves it. A skip therefore counts as a
      # failure: otherwise a later change to the runners would suspend the test
      # silently and the build would stay green.
      PRTG_E2E_SKIP_CODE: "1"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Show the prerequisites
        run: |
          echo "Architecture: $(uname -m)"
          docker version --format 'Docker server: {{.Server.Version}}' ||
            echo "No Docker access"

      - name: Check the rollout against a real prtgmpprobe
        run: ./tests/e2e-mpp.sh

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "=== Containers ==="
          docker ps -a --filter name=prtg-e2e --filter name=prtg-nats || true
          echo "=== Probe journal ==="
          docker exec prtg-e2e-probe \
            journalctl -u prtg.mpprobe.service -n 80 --no-pager || true
          echo "=== NATS logs ==="
          docker logs --tail 80 prtg-nats || true

      - name: Tear the test environment down safely
        if: always()
        run: |
          docker rm -f prtg-e2e-probe prtg-e2e-admin prtg-nats \
            >/dev/null 2>&1 || true
          # After the containers: the admin container mounts the runtime
          # volume, and a run that died before its own cleanup leaves an
          # installation behind that the next "init" would refuse to overwrite.
          docker volume rm prtg-nats-runtime prtg-nats-data \
            >/dev/null 2>&1 || true
          docker network rm prtg-e2e-net >/dev/null 2>&1 || true
